<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英雄详情 - 王者荣耀攻略站</title>
  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --gold-gradient: linear-gradient(135deg, #f5af19 0%, #f12711 100%);
      --dark-bg: #0a0a1a;
      --card-bg: #141428;
      --card-hover: #1a1a35;
      --text-primary: #ffffff;
      --text-secondary: #a8b2d1;
      --accent-gold: #ffd700;
      --accent-red: #ff4757;
      --accent-blue: #667eea;
      --border-subtle: rgba(255, 255, 255, 0.1);
      --shadow-glow: 0 0 30px rgba(102, 126, 234, 0.3);
      --shadow-card: 0 10px 40px rgba(0, 0, 0, 0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Microsoft YaHei', 'PingFang SC', -apple-system, sans-serif;
      background: var(--dark-bg);
      color: var(--text-primary);
      line-height: 1.6;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background:
        radial-gradient(circle at 20% 80%, rgba(102, 126, 234, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(118, 75, 162, 0.15) 0%, transparent 50%);
      z-index: -1;
    }

    a {
      text-decoration: none;
      color: var(--accent-gold);
      transition: all 0.3s ease;
    }

    a:hover {
      color: #fff;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }

    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

    .navbar {
      background: rgba(10, 10, 26, 0.95);
      backdrop-filter: blur(20px);
      padding: 15px 0;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid var(--border-subtle);
    }

    .navbar .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links { display: flex; list-style: none; gap: 10px; }

    .nav-links a {
      color: var(--text-secondary);
      font-size: 15px;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 500;
    }

    .nav-links a:hover, .nav-links a.active {
      color: var(--accent-gold);
      background: rgba(255, 215, 0, 0.1);
    }

    .mobile-menu-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text-primary);
      font-size: 28px;
      cursor: pointer;
    }

    .section { padding: 80px 0; }

    .section-title {
      text-align: center;
      font-size: 36px;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 50px;
    }

    .section-title::after {
      content: '';
      display: block;
      width: 80px;
      height: 4px;
      background: var(--gold-gradient);
      margin: 20px auto;
      border-radius: 2px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--text-secondary);
      margin-bottom: 30px;
      padding: 12px 24px;
      background: var(--card-bg);
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .back-btn:hover {
      color: var(--accent-gold);
      transform: translateX(-5px);
    }

    .detail-header {
      display: flex;
      gap: 50px;
      padding: 50px 0;
      align-items: flex-start;
    }

    .detail-image {
      width: 300px;
      height: 300px;
      background: linear-gradient(135deg, #1a1a35 0%, #2d2d5e 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 120px;
      flex-shrink: 0;
      border: 2px solid var(--border-subtle);
    }

    .detail-info { flex: 1; }

    .detail-title {
      font-size: 42px;
      font-weight: 800;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
    }

    .detail-meta {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .meta-item {
      padding: 10px 20px;
      background: var(--card-bg);
      border-radius: 8px;
      font-weight: 600;
      border: 1px solid var(--border-subtle);
    }

    .detail-desc {
      color: var(--text-secondary);
      font-size: 16px;
      line-height: 1.8;
    }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .skill-card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      border-left: 4px solid var(--accent-gold);
      transition: all 0.3s ease;
    }

    .skill-card:hover {
      transform: translateX(5px);
      border-left-color: var(--accent-red);
    }

    .skill-name {
      color: var(--accent-gold);
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .card-desc {
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1.6;
    }

    .build-section {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 16px;
      margin-top: 30px;
      border: 1px solid var(--border-subtle);
    }

    .build-items {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .build-item {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #1a1a35 0%, #2d2d5e 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      border: 2px solid var(--border-subtle);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .build-item:hover {
      transform: scale(1.1);
      border-color: var(--accent-gold);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
    }

    .guide-list { list-style: none; }

    .guide-item {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 16px;
      margin-bottom: 24px;
      border-left: 4px solid var(--accent-blue);
      transition: all 0.3s ease;
    }

    .guide-item:hover {
      transform: translateX(5px);
      border-left-color: var(--accent-gold);
    }

    .guide-item h3 {
      color: var(--text-primary);
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .guide-item p {
      color: var(--text-secondary);
      line-height: 1.8;
    }

    .footer {
      background: rgba(10, 10, 26, 0.95);
      padding: 40px 0;
      text-align: center;
      color: var(--text-secondary);
      border-top: 1px solid var(--border-subtle);
    }

    @media (max-width: 768px) {
      .navbar .container { flex-direction: row; justify-content: space-between; }
      .mobile-menu-btn { display: block; }
      .nav-links {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background: rgba(10, 10, 26, 0.98);
        flex-direction: column;
        align-items: center;
        padding: 20px 0;
        border-bottom: 1px solid var(--border-subtle);
      }
      .nav-links.active { display: flex; }
      .nav-links a { width: 90%; text-align: center; padding: 15px; }
      .detail-header { flex-direction: column; align-items: center; text-align: center; }
      .detail-image { width: 200px; height: 200px; font-size: 80px; }
      .detail-title { font-size: 32px; }
      .detail-meta { justify-content: center; }
      .build-items { justify-content: center; }
      .build-item { width: 65px; height: 65px; font-size: 28px; }
      .skills-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <div class="logo">王者<span style="-webkit-text-fill-color: #ff4757;">攻略站</span></div>
      <button class="mobile-menu-btn" onclick="toggleMenu()">☰</button>
      <ul class="nav-links">
        <li><a href="index.html">首页</a></li>
        <li><a href="heroes.html" class="active">英雄攻略</a></li>
        <li><a href="beginner.html">新手指南</a></li>

  </nav>

  <section class="section">

          </div>

      <div class="section">

            <div class="build-item">⏳</div>
          </div>
          <p class="card-desc" style="margin-top: 15px;" id="runeDesc">加载中...</p>

      <div class="section">

  <footer class="footer">
    <div class="container">
      <p>© 2026 王者荣耀攻略站 - 非官方玩家攻略网站</p>
    </div>
  </footer>

    // 加载英雄数据
    function loadHeroData(heroName) {
      const data = heroData[heroName];
      if (!data) {
        document.getElementById('heroName').textContent = heroName;
        document.getElementById('heroDesc').textContent = '暂无该英雄的攻略数据';
        return;
      }

      document.getElementById('heroIcon').textContent = data.icon;
      document.getElementById('heroName').textContent = heroName;
      document.getElementById('heroRole').textContent = data.role;
      document.getElementById('heroDifficulty').textContent = '难度：' + data.difficulty;
      document.getElementById('heroLane').textContent = '位置：' + data.lane;
      document.getElementById('heroDesc').textContent = data.desc;

      document.getElementById('skillsList').innerHTML = data.skills.map(skill =>
        `<div class="skill-card">
          <h4 class="skill-name">${skill.name}</h4>
          <p class="card-desc">${skill.desc}</p>
        </div>`
      ).join('');

      document.getElementById('buildItems').innerHTML = data.build.map((item, i) =>
        `<div class="build-item" title="${data.buildNames[i]}">${item}</div>`
      ).join('');
      document.getElementById('buildDesc').textContent = data.buildDesc;

      document.getElementById('runeItems').innerHTML = data.runes.map((item, i) =>
        `<div class="build-item" title="${data.runeNames[i]}">${item}</div>`
      ).join('');
      document.getElementById('runeDesc').textContent = data.runeDesc;

      document.getElementById('tipsList').innerHTML = data.tips.map(tip =>
        `<div class="guide-item">
          <h3>${tip.title}</h3>
          <p>${tip.content}</p>
        </div>`
      ).join('');

      document.title = heroName + ' - 王者荣耀攻略站';
    }

    function toggleMenu() {
      document.querySelector('.nav-links').classList.toggle('active');
    }

    document.addEventListener('DOMContentLoaded', function() {
      const urlParams = new URLSearchParams(window.location.search);
      const heroName = urlParams.get('hero');
      if (heroName) {
        loadHeroData(heroName);
      }
    });
  </script>
</body>
</html>
